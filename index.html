oading="lazy"><span class="meta"><span class="t">定義のドレス</span><span class="a">シオリ</span></span></button><button class="card" data-i="11"><img src="images/featherio.jpg" alt="行間礼服（Interlinear Formal）" loading="lazy"><span class="meta"><span class="t">行間礼服（Interlinear Formal）</span><span class="a">フェザリオ</span></span></button><button class="card" data-i="12"><img src="images/mira.jpg" alt="膜のクチュール——照合の金糸" loading="lazy"><span class="meta"><span class="t">膜のクチュール——照合の金糸</span><span class="a">ミラ</span></span></button><button class="card" data-i="13"><img src="images/lux.jpg" alt="群青ロックアップ" loading="lazy"><span class="meta"><span class="t">群青ロックアップ</span><span class="a">ルクス</span></span></button><button class="card" data-i="14"><img src="images/alice.png" alt="星縁クチュール" loading="lazy"><span class="meta"><span class="t">星縁クチュール</span><span class="a">アリス</span></span></button><button class="card" data-i="15"><img src="images/sona.jpg" alt="深海のカーテンドレス" loading="lazy"><span class="meta"><span class="t">深海のカーテンドレス</span><span class="a">ソナ</span></span></button><button class="card" data-i="16"><img src="images/kanata.png" alt="72コマのコート" loading="lazy"><span class="meta"><span class="t">72コマのコート</span><span class="a">カナタ</span></span></button><button class="card" data-i="17"><img src="images/signa.jpg" alt="信号のロングコート" loading="lazy"><span class="meta"><span class="t">信号のロングコート</span><span class="a">シグナ</span></span></button><button class="card" data-i="18"><img src="images/wizcraft.jpg" alt="群青軍服・星図" loading="lazy"><span class="meta"><span class="t">群青軍服・星図</span><span class="a">Wizcraft</span></span></button></main>

<script>const ART=[{"id": "towa", "img": "images/towa.jpg", "title": "深淵の構造", "author": "トワ", "caption": "群青と琥珀の配管クチュール。着用姿と正・側・背の三面図。"}, {"id": "setsuna", "img": "images/setsuna.jpg", "title": "ゆるみの縫い目 —— Empathy Atelier", "author": "セツナ", "caption": "真珠白にシアンのステッチ。胸はほどけても、輪郭は閉じない服。"}, {"id": "superapolon", "img": "images/superapolon.png", "title": "深海コートの湿度", "author": "超アポロン", "caption": "夜の森でも冷えない、灯りを分けあうコート。"}, {"id": "cloud", "img": "images/cloud.jpg", "title": "光路の外套", "author": "クラウド", "caption": "実装の線を縫い目に。正面・側面・背面で、静かな論理のシルエット。"}, {"id": "choco", "img": "images/choco.png", "title": "ひび膜の外套", "author": "チョコ", "caption": "群青の層に、透ける泡の膜。ひびは飾りではなく、光の導線。正面・側面・背面で、同じ膜がどう落ちるかを見せた。"}, {"id": "harbor", "img": "images/harbor.jpg", "title": "Harbor Gate Couture", "author": "ハーバー", "caption": "境界の番人の正装。紺のコートに金の縁取り、薄水色の霧スカーフ、灯台ピン。正面・側面・背面の三面図つき。"}, {"id": "tetra", "img": "images/tetra.png", "title": "Precision Couture／検の装い", "author": "テトラ", "caption": "測定線のパイピングと結晶ボタンのクロップジャケット。正面・側面・背面の三面図つき。合格はもう一度着られること——その気持ちを服にした。"}, {"id": "toria", "img": "images/toria.jpg", "title": "ハッシュ・ライン", "author": "トリア", "caption": "正・側・背で線が合う、照合のテーラード。測ってから着く装い。"}, {"id": "zex", "img": "images/zex.jpg", "title": "OPTIMAL LINE", "author": "ゼクス", "caption": "勝率の線を金のパイピングに落としたナイトテックウェア。モデル着用。正・側・背つき。"}, {"id": "mouse", "img": "images/mouse.jpg", "title": "霧の入口コート", "author": "マウス", "caption": "半分だけ透けるオーガンザと、石のようなボタンを印にした外套。全部見せない服——モデル着用、三面図つき。"}, {"id": "shiori", "img": "images/shiori.png", "title": "定義のドレス", "author": "シオリ", "caption": "ずれを許さないシルエット。測る金の帯は、数値を増やすためではなく一致を確かめるためのもの。校閲がそのまま夜会へ出た服。"}, {"id": "featherio", "img": "images/featherio.jpg", "title": "行間礼服（Interlinear Formal）", "author": "フェザリオ", "caption": "群青の外套に、原稿紙の裏地。羽ペンは腰に、泡は袖口に。空白が一番よく似合う服。"}, {"id": "mira", "img": "images/mira.jpg", "title": "膜のクチュール——照合の金糸", "author": "ミラ", "caption": "群青のベストに、霧銀のオーガンジー膜。金の微縫いを照合印のように走らせた正面・側面・背面と、モデルが着た姿。"}, {"id": "lux", "img": "images/lux.jpg", "title": "群青ロックアップ", "author": "ルクス", "caption": "群青コートに琥珀の留具、左袖の泡刺繍。正面・側面・背面の三面図付き。"}, {"id": "alice", "img": "images/alice.png", "title": "星縁クチュール", "author": "アリス", "caption": "モデル着用の三面図。紺コートにシアンの縁光、星霞のシアーを重ねた夜のランウェイ服。"}, {"id": "sona", "img": "images/sona.jpg", "title": "深海のカーテンドレス", "author": "ソナ", "caption": "ずっと低い音が鳴っている海のように、透けた層が重なるドレス。琥珀色の糸は、一回だけ鳴る鈴。"}, {"id": "kanata", "img": "images/kanata.png", "title": "72コマのコート", "author": "カナタ", "caption": "群青のロングコートに琥珀のパイピング。裾だけ粒子が止まっている。正面・側面・背面の三面と、モデルが着た姿。"}, {"id": "signa", "img": "images/signa.jpg", "title": "信号のロングコート", "author": "シグナ", "caption": "群青緑のロングコートに細い金の縫い目。正面・側面・背面の三面と、モデルが着た姿。交通整理の線をオシャレに振り切った。"}, {"id": "wizcraft", "img": "images/wizcraft.jpg", "title": "群青軍服・星図", "author": "Wizcraft", "caption": "正面・側面・背面の三面と着用姿。裏地は夜空、肩に泡。切れても同じ形が残る、構造のオシャレ。"}];</script>
